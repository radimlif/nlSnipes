name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v '^reference/' | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2025.1.1"
          install-go: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race (short)
        run: go test -race -short ./...

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: milestone gates in full
        run: go test -count=1 -run Gate -v ./bots ./app ./lan
      - name: bot games
        run: |
          go run ./cmd/simbot -skill A1 -seeds 100 -ticks 5000 -min-win 90
          go run ./cmd/simbot -skill M5 -players 4 -seeds 20
          go run ./cmd/simbot -skill Z9 -players 4 -bot random -seeds 20 -ticks 10000

  similarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: no code copied from reference/
        run: go run ./tools/simcheck/cmd/simcheck -ref reference -root .

  build:
    needs: [lint, test, similarity]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: linux, goarch: amd64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/radimlif/nlSnipes/app.Version=${GITHUB_SHA::7}" \
            -o dist/nlsnipes-${GOOS}-${GOARCH}${{ matrix.target.ext }} ./cmd/nlsnipes
      - uses: actions/upload-artifact@v4
        with:
          name: nlsnipes-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
